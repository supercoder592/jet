name: 匯出 Web 並發布到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個發布，後推的蓋掉前一個
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7-stable
    steps:
      - uses: actions/checkout@v4

      - name: 下載 Godot 與匯出樣板
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o tpl.tpz   "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          # 樣板要放在 <version>.stable 這個資料夾底下，名稱錯了匯出會說找不到樣板
          unzip -q tpl.tpz -d /tmp/tpl
          mkdir -p ~/.local/share/godot/export_templates
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"

      - name: 匯入資源
        # 第一次匯入一定會以非 0 結束（沒有 .godot 快取），這裡不能讓它中斷流程
        run: godot --headless --path . --import || true

      - name: 檢查每一支腳本都解析得過
        # 匯出**不會**解析腳本，而 NetSmoke.gd / AutoPlay.gd 這類「有開關才掛上」的
        # 檔案正常啟動也碰不到 ─ 打錯字會一路溜到瀏覽器裡才爆。擋在匯出前面。
        run: godot --headless --path . --script res://tools/check_scripts.gd

      - name: 檢查字型涵蓋所有用到的字元
        # 網頁版沒有系統字型可以 fallback，缺字直接變空白方框，
        # 而且在桌面上完全看不出來 ─ 所以擋在匯出前面
        run: godot --headless --path . --script res://tools/check_font.gd

      - name: 匯出 Web
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          # 沒有這個檔案，GitHub Pages 會用 Jekyll 處理並吃掉部分檔案
          touch build/web/.nojekyll
          ls -lh build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
